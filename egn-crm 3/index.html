<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CRM — EGN Rénovation</title>
<!-- PWA : installation en application sur téléphone -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1A2B3D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EGN CRM">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Saira:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<!-- Remplissage de PDF : pdf.js pour l'aperçu, pdf-lib pour l'écriture -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.50.0/dist/umd/supabase.js"></script>
<link rel="stylesheet" href="assets/css/crm.css">
</head>
<body>
<!-- ============ LOGIN ============ -->
<div class="login" id="loginScreen">
  <div class="login-card">
    <div class="login-head">
      <div class="login-logo" id="loginLogo"></div>
      <div class="login-sub">CRM · Gestion commerciale</div>
    </div>
    <div class="login-body">
      <label>Code utilisateur</label>
      <input id="loginCode" placeholder="Ex : TEST" autocomplete="off">
      <label>Mot de passe</label>
      <input id="loginPwd" type="password" placeholder="••••••••" autocomplete="off">
      <button class="login-btn" onclick="doLogin()">Se connecter →</button>
      <div class="login-err" id="loginErr">Code ou mot de passe incorrect</div>
      <div class="login-hint" id="loginHint"></div>
    </div>
  </div>
</div>

<!-- ============ APP ============ -->
<div class="sb-backdrop" onclick="toggleSidebar()"></div>
<div class="app" id="app">
  <aside class="sidebar">
    <div class="sb-brand" id="sbBrand" onclick="if(ME)go('dash')" style="cursor:pointer"></div>
    <nav id="navMenu"></nav>
    <div class="sb-foot">
      <div class="av" id="meAv">?</div>
      <div class="info"><div class="n" id="meName">—</div><div class="r" id="meRole">—</div></div>
      <button class="out" onclick="logout()" title="Déconnexion">⏻</button>
    </div>
  </aside>
  <main class="main">
    <div class="topbar">
      <button class="sb-toggle" id="sbToggle" onclick="toggleSidebar()" title="Réduire / agrandir le menu">☰</button>
      <button class="home-btn" id="homeBtn" onclick="go('dash')" title="Accueil"></button>
      <div>
        <h1 id="pageTitle">Tableau de bord</h1>
        <div class="sub" id="pageSub">Vue d'ensemble de l'activité</div>
      </div>
      <div class="seg-switch" id="segSwitch"></div>
      <div class="gsearch-wrap" style="position:relative;margin-left:1rem">
        <input id="gsearchInput" class="gsearch-input" placeholder="🔍 Rechercher un dossier, un client…" oninput="globalSearch(this.value)" onfocus="if(this.value)globalSearch(this.value)">
        <div id="gsearchResults" class="gsearch-results" style="display:none"></div>
      </div>
      <div class="notif-wrap" style="position:relative;margin-left:.6rem">
        <button class="iconbtn" id="notifBell" onclick="toggleNotifPanel()" title="Notifications" style="font-size:1.15rem;position:relative">🔔<span id="notifDot" class="notif-dot" style="display:none"></span></button>
        <div id="notifPanel" class="notif-panel" style="display:none"></div>
      </div>
      <div class="sp" id="pageActions"></div>
    </div>
    <div class="content" id="content"></div>
  </main>
</div>

<!-- modal host -->
<div class="modal-bg" id="modalBg"><div class="modal" id="modalBox"></div></div>
<div class="toast" id="toast"></div>

<!-- Autocomplétion des mentions -->
<div id="mentionBox" class="mention-box" style="display:none"></div>

<!-- Bulle calculatrice de prime -->
<div id="calcFab" onclick="toggleCalcPrime()" title="Calculatrice de prime">🧮</div>
<div id="calcPanel">
  <div id="calcHead">
    <span style="font-size:1rem">🧮</span>
    <span style="flex:1;font-weight:800;font-size:.86rem">Calculatrice de prime</span>
    <button onclick="resetCalcPrime()" title="Réinitialiser" style="background:none;border:none;cursor:pointer;font-size:.8rem;color:#a8b5c1">↺</button>
    <button onclick="toggleCalcPrime()" title="Fermer" style="background:none;border:none;cursor:pointer;font-size:1rem;color:#a8b5c1">✕</button>
  </div>
  <div id="calcBody"></div>
</div>



<script src="assets/js/core/01-moteur.js"></script>
<script src="assets/js/core/02-navigation.js"></script>
<script src="assets/js/modules/10-dashboard.js"></script>
<script src="assets/js/modules/11-dossiers.js"></script>
<script src="assets/js/modules/13-paiements.js"></script>
<script src="assets/js/modules/14-tva.js"></script>
<script src="assets/js/core/03-fichiers.js"></script>
<script src="assets/js/modules/15-scanner.js"></script>
<script src="assets/js/modules/16-prime-deal.js"></script>
<script src="assets/js/modules/17-planning.js"></script>
<script src="assets/js/admin/20-utilisateurs.js"></script>
<script src="assets/js/modules/21-stock.js"></script>
<script src="assets/js/admin/22-documents.js"></script>
<script src="assets/js/admin/23-operations.js"></script>
<script src="assets/js/modules/24-calculatrice.js"></script>
<script src="assets/js/core/99-demarrage.js"></script>

</body>
</html>
